# 医学术语词表（机器唯一真源；规则与协议见 references/protocols/term-lexicon-protocol.md）
# 消费方：scripts/term_expand.py（发现侧扩展）、scripts/review_knowledge.py（T-01 事后校验）
# 结构：四类关系有向；report 为 true 的关系才产出 T-01 finding（上下位与正字变体一律不报）
# 编辑规则：运行中只增不改；任务内冻结本文件，新词先进 references/lexicon/term-lexicon.candidates.yaml 候选队列（见协议件 §6）
# 格式约束：本文件是团队手写的 YAML 子集，脚本自带读取器（scripts/term_expand.py）——只用块映射与块序列，
#   序列可与所属键同缩进，同一序列各项必须同缩进、各项续行缩进保持一致；不要用锚点、多文档与自定标签。
version: lexicon v8.0
frozen_at: 2026-09-21

# 四类关系与其记法（记法即 direction 取值，见 references/protocols/term-lexicon-protocol.md §1）；report: true 才进 T-01。
relations:
  - type: synonym
    label: 同义
    symbol: "="
    report: true
  - type: hierarchy
    label: 上下位
    symbol: "⊃⊂"
    report: false
  - type: confusable
    label: 易混
    symbol: "≠"
    report: true
  - type: variant
    label: 正字变体
    symbol: "≈"
    report: false

